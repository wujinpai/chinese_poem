<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chinese Poems Puzzle - 古诗拼图">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="古诗拼图">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>古诗拼图</title>
  <link rel="manifest" href="manifest.json">

  <script>
    (function() {
      var link = document.createElement('link');
      link.rel = 'preload';
      link.href = 'assets/fonts/NotoSansSC-Regular.ttf';
      link.as = 'font';
      link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
      
      new FontFace('NotoSansSC', 'url(assets/fonts/NotoSansSC-Regular.ttf)').load().then(function(font) {
        document.fonts.add(font);
      }).catch(function(e) {
        console.warn('Failed to load NotoSansSC font:', e);
      });
    })();
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFF8E1;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #5D4037;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #FFECB3;
      border-top: 4px solid #FF8F00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">古诗拼图加载中...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
